[metadata]
name = testforge-cli-utils
version = 0.3.0
description = Hardware/System-level test automation framework for CXL, PCIe, BMC, and firmware validation.
long_description = file: README.md
long_description_content_type = text/markdown
author = Marie Infantraj
author_email = marioredfoxfshm@gmail.com
license = GPL-3.0-only
url = https://github.com/MARIOREDFOX/TestForge
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Intended Audience :: Developers
    Topic :: System :: Hardware
    Topic :: Software Development :: Testing

[options]
package_dir =
    =src
packages = find:
# paramiko is listed as an optional extra so the package imports cleanly
# even when paramiko is not installed. Users who need SSH must install it:
#   pip install testforge-cli-utils[ssh]
install_requires =
    click>=8.0
    requests>=2.28
    PyYAML>=6.0
    rich>=13.0
python_requires = >=3.8

[options.extras_require]
ssh =
    paramiko>=3.0
all =
    paramiko>=3.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    testforge = testforge_cli_utils.cli:cli
