# TestForge environment file

# Single host
hostname: 192.168.1.6
username: root
# password: "your_password"
# key_filename: "~/.ssh/id_rsa"

# Network thresholds (used by 'network' tag)
max_packet_loss_pct: 5
max_latency_ms: 200
latency_target: "8.8.8.8"

# Stress test thresholds (used by 'stress' tag)
stress_thresholds:
  cpu_stress_duration: 30
  mem_stress_duration: 30
  io_stress_duration:  30
  mem_stress_vm_bytes: "1G"
  mem_stress_workers:  1
  cpu_stress_workers:  0    # 0 = all CPUs

# --- Multi-host parallel execution ---
# hosts:
#   - 192.168.1.10
#   - 192.168.1.11
#   - 192.168.1.12
# parallel_workers: 3

# --- CXL health check runner ---
